# Despliegue estático en Google App Engine (standard).
# Desde la carpeta web/:  gcloud app deploy
runtime: python312

# Lo que no es del sitio (README, configuración) no se sube: ver .gcloudignore

handlers:
  - url: /
    static_files: index.html
    upload: index.html
    secure: always

  - url: /(.*)
    static_files: \1
    upload: .*
    secure: always
    http_headers:
      X-Content-Type-Options: nosniff
      X-Frame-Options: DENY
      Referrer-Policy: strict-origin-when-cross-origin
